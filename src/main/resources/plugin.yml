name: DanzzBot
version: 1.3.0
main: com.danzzreal.danzzbot.DanzzBot
api-version: '1.21'
author: DanzzReal
description: Plugin Advanced Fake Player GUI Multi-Page & Humanoid AI.
commands:
  botgui:
    description: Buka menu GUI utama DanzzBot
    permission: danzzbot.admin
  botcreate:
    description: Tambah bot ke daftar list
    permission: danzzbot.admin
  botspawn:
    description: Spawn bot dari list ke dunia
    permission: danzzbot.admin
  botrename:
    description: Ganti nama bot
    permission: danzzbot.admin
  botskin:
    description: Atur skin URL bot
    permission: danzzbot.admin
  nametag:
    description: Atur nametag bot
    permission: danzzbot.admin
  botgradient:
    description: Atur warna gradient nametag terpisah
    permission: danzzbot.admin
    
