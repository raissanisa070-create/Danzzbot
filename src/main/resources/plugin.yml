name: DanzzBotPremium
version: 47.0
main: com.danzzreal.danzzbot.DanzzBot
api-version: 1.20
authors: [DanzzReal]
description: Premium Commercial Minecraft Bot Suite with External BotList Folder & AI.
depend: [Citizens, Vault]
softdepend: [PlaceholderAPI]

commands:
  danzzbot:
    description: Master command utama DanzzBot
    permission: danzzbot.admin
    aliases: [dbot, danzz]
  botmenu:
    description: Membuka GUI Control Panel
    aliases: [cpanel]
  botsettings:
    description: Membuka Sub-Menu Settings
  botchat:
    description: Mengatur Auto/Manual Chat
    aliases: [bchat]
  botrpg:
    description: Membuka menu Bot RPG
  botlist:
    description: Membuka Spawn Hub Bot
  botcreate:
    description: Membuat bot baru
  botremove:
    description: Menu hapus bot
  botremoveall:
    description: Hapus semua bot
  botcontract:
    description: Menu kontrak kerja
    
