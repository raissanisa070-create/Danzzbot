# settings you can change it but it is not recommended thank you!!
# leave it to you, the important thing is that you understand 
# False : off | True : on
settings:
  default-bot-name: "DanzzBotPremium"
  default-skin-url: "https://textures.minecraft.net/texture/c61d3615dedf4beae515ef861c28c68aa2fe3051c72ea98dbf28e200155b93"
  tps-protection-threshold: 18.0
  default-max-bots: 3
  license-key: "COMMERCIAL-KEY-ULTIMATE-460"
  language: "id"

# enhine toogled changing settings must be done be careful
# _DanzzBot Premium_
# False : off | True : on
engine-toggles:
  cpvp-combat: true
  autonomous-mining: true
  autonomous-farming: true
  autonomous-fishing: true
  base-defense: true
  chatbot-slang: true
  autonomous-daily-routine: true
  social-chat-response: true
  chest-looting: true
  mysql-storage: false
  smart-pathfinding: true
  papi-expansion: true
  multi-language: true
  permission-quota: true

# You can set it to on or off and change the nominal value.
# bot economy This feature requires vault - ecobomy
# False : off | True : on
bot-economy:
  enabled: true
  use-vault-money: true
  currency-symbol: "$"
  currency-material: "DIAMOND"
  costs:
    defense-contract: 5000
    mining-contract: 1500
    farming-contract: 1000
    fishing-contract: 1200
    base-contract: 10000

# bot default loadout you can turn it on or off 
# dan kalian bisa mengaturnya di sini atau di menu gui
# this is an automatic bot tool 
# False : off | True : on
bot-default-loadout:
  enabled: true
  helmet: "NETHERITE_HELMET"
  chestplate: "NETHERITE_CHESTPLATE"
  leggings: "NETHERITE_LEGGINGS"
  boots: "NETHERITE_BOOTS"
  main-hand: "NETHERITE_SWORD"
  off-hand: "TOTEM_OF_UNDYING"

# Bot bot blood can be mixed and can be turned on or off
# And can eat golden apple when blood is 10/8
# False : off | True : on
bot-combat-health:
  max-health: 20.0
  auto-eat-gapple:
    enabled: true
    trigger-health-threshold: 10.0
    regain-amount: 8.0

# This feature can protect your base from thieves.
# Can also help kill enemies who enter the base
# False : off | True : on
Base security:
base-security:
  enabled: true
  defense-radius-blocks: 15.0
  warning-message: "&c[Base Security] Peringatan! Zona terlarang, menjauhlah dari area base!"

# Rank for bots so this feature is similar to luck perms
# bisa di on off kan 
# False : off | True : on
luckperms-rank:
  enabled: true
  default-rank-prefix: "&b[VIP] "
  
