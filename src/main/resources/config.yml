settings:
  default-health: 20.0
  pvp-damage: 9.0
  detection-range: 16.0

# Pengaturan Skin Default Bot & GUI Heads (Menggunakan URL MineSkin)
default-skin:
  url: "https://minesk.in/b99aa1f02594468c95307736628af54a"
  model: "wide"

# Status On/Off Fitur (Bisa di-klik langsung melalui /botgui Page 2)
features:
  health-indicator:
    enabled: true
    high-health-text: " [❤❤❤❤❤]"
    low-health-text: " [❤❤]"

  auto-chat:
    enabled: true
    interval-ticks: 300

  possess-mode:
    enabled: true

  combat-effects:
    enable-totem-pop: true
    enable-mace-aoe-smash: true

  bot-pvp-attack:
    enabled: true

  auto-kill-nearest-player:
    enabled: false

  ai-activities:
    enabled: true

