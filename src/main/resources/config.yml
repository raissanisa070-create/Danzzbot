# ==========================================
# DanzzBot Enterprise Configuration File
# ==========================================

settings:
  follow: true
  attack-cpvp: true
  mining: true
  claim-protection: true
  chatbot: true
  hologram: true
  bossbar-status: true
  particle-aura: true
  skin-system: true

skin-settings:
  default-skin-user: "DanzzReal"

default-equipment:
  helmet: "NETHERITE_HELMET"
  chestplate: "NETHERITE_CHESTPLATE"
  leggings: "NETHERITE_LEGGINGS"
  boots: "NETHERITE_BOOTS"
  main-hand: "NETHERITE_PICKAXE"
  off-hand: "TOTEM_OF_UNDYING"

combat:
  auto-heal: true
  resistance-amplifier: 1
  attack-radius: 10.0

luckperms-rank:
  enabled: true
  default-rank-prefix: "&b[BOT] "

motd:
  enabled: true
  text: "&#00F2FF&lDanzzBot Enterprise Network 2026"
  # Jika true, extra online count akan bertambah otomatis sebanyak bot yang aktif di server
  dynamic-bot-count: true
  # Angka tambahan statis (jika dynamic-bot-count false, atau sebagai bonus tambahan)
  extra-online-count: 5

visuals:
  hologram-format: "%luckperms_prefix%&#00F2FF%npc_name% &7- &#00FF66%health% HP"
  bossbar-format: "%luckperms_prefix%&#00F2FF%npc_name%"
  aura-type: "SOUL_FIRE_FLAME"

messages:
  prefix: "&8[&b&lDanzzBot&8] &r"
  show-rank-on-join: true
  join-format: "%luckperms_prefix%&e%npc_name% bergabung ke server!"
  join-format-plain: "&e%npc_name% bergabung ke server!"
  death-format: "%luckperms_prefix%&c%npc_name% gugur dalam pertempuran!"
  chat-format: "%luckperms_prefix%&b%npc_name% &7» &f%message%"

chat-slang:
  - "Woi, jangan rebutan mineral!"
  - "Suhu, bantu aku bersihin area ini dong."
  - "saya aktif dan siap tempur!"
  - "Aman, TPS server tetap stabil!"
  
