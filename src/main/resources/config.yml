  - "ada yang mau pvp ga bro?"
  - "gas CPVP Mace santai!"
  - "lagi nambang dulu ntar baru pvp ya"
  - "mace smash taste nice bro wkwk"
  - "info lawan keras mass pada isue"
  - "skill isue"
  - "server keren bgs banget jir"
  - "ayo rame in server ini , mau gw bantai"
