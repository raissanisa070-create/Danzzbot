settings:
  default-health: 20.0
  pvp-damage: 9.0
  detection-range: 16.0

# Pengaturan On/Off Seluruh Fitur Modern Secara Real-time
features:
  health-indicator:
    enabled: true
    high-health-text: " [❤❤❤❤❤]"
    low-health-text: " [❤❤]"

  auto-chat:
    enabled: true
    interval-ticks: 300

  possess-mode:
    enabled: true

  combat-effects:
    enable-totem-pop: true
    enable-mace-aoe-smash: true

  # Fitur Bot Menyerang / PvP Player di Sekitar
  bot-pvp-attack:
    enabled: true

  # Fitur Auto-Kill Player Terdekat (Bot langsung melenyapkan target dalam jangkauan)
  auto-kill-nearest-player:
    enabled: false                 # Ubah ke true jika ingin bot auto-kill player sekitar secara otomatis

  ai-activities:
    enabled: true

